version: "3.9"

services:
  # ── PostgreSQL (active) ──
  postgres:
    image: postgres:16-alpine
    container_name: technova-postgres
    environment:
      POSTGRES_USER: technova
      POSTGRES_PASSWORD: technova
      POSTGRES_DB: technova
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U technova"]
      interval: 10s
      timeout: 5s
      retries: 5

